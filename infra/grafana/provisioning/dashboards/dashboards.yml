# Grafana dashboard provisioning (EP-OBS-COLLECTOR) — load the starter dashboard(s)
# from the mounted folder.
apiVersion: 1
providers:
  - name: govai
    orgId: 1
    folder: GovAI
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
