services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      # Senha vem do env (.env). Refuse to start if missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; see .env.example}
      POSTGRES_DB: govai
    ports:
      - "5432:5432"
    volumes:
      # bootstrap.sql NÃO é mais auto-executado pelo entry-point: ele exige
      # `SET govai.app_password` na sessão, o que o docker-entrypoint-initdb.d
      # não consegue fazer. Rode `pnpm --filter @govai/api run migrate` após
      # o container subir (ver README e docs/runbooks/db-roles-production.md).
      - govai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # EP-SEALER-DEPLOY: the B3 AuditSealer as a runnable deploy unit (self-contained esbuild bundle,
  # `node dist/bundle.mjs`, non-root). NOTE: Postgres here is NOT auto-migrated (see the postgres
  # note above) — run `pnpm --filter @govai/api run migrate` (with GOVAI_DB_EVIDENCE_ENUMERATOR_PASSWORD
  # set, to provision the enumerator) BEFORE the sealer can be healthy; until then the sealer stays
  # alive but NOT ready (startup probe / org_discovery), by design.
  audit-sealer:
    # FIXUP (PR #117 Fix 3): a `sealer` compose profile so `docker compose up -d postgres` never
    # selects this service. Belt-and-suspenders with the optionalized (`:-`) sealer-only envs below
    # — the repo already separates `:?` envs (the observability stack was moved to its own file for
    # exactly this reason), so `${VAR:?}` is evaluated at compose-model-build even for `up postgres`.
    profiles: ["sealer"]
    build:
      context: ..
      dockerfile: apps/audit-sealer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # FIXUP (PR #117 Fix 1): NODE_ENV=development. The Dockerfile hard-sets NODE_ENV=production,
      # but @govai/config loadEnv() THROWS in production when KMS_DEV_SEED is set or
      # GOVAI_KMS_PROVIDER=dev — so the dev-KMS vars this local file injects would crash the
      # container at boot. Compose `environment:` overrides the image ENV; under development both
      # KMS guards are skipped. This compose is a local/dev file — development is the honest value.
      NODE_ENV: development
      # The sealer's OWN connection — the runner identity is a member of both phase roles
      # (govai_audit_sealer + govai_app). Never the API request pool. Optionalized to `:-` (Fix 3)
      # so `up -d postgres` doesn't require it; the sealer APP fails loud on a missing value at boot
      # (config.ts: databaseUrl is z.string().min(1)) when the `sealer` profile is actually started.
      AUDIT_SEALER_DATABASE_URL: ${AUDIT_SEALER_DATABASE_URL:-}
      # ★ RUNTIME org-discovery URL: connects AS the least-privilege govai_evidence_enumerator role
      # (PR #115) to SELECT id FROM govai.orgs. This is a RUNTIME connection URL — NOT the
      # migrate-time provision password GOVAI_DB_EVIDENCE_ENUMERATOR_PASSWORD (which MANAGES the
      # credential and must never be runtime config). Optional here; if unset, pin AUDIT_SEALER_ORG_IDS
      # instead. With NEITHER set the sealer fails loud at boot (no silent empty discovery).
      AUDIT_SEALER_ENUMERATOR_DATABASE_URL: ${AUDIT_SEALER_ENUMERATOR_DATABASE_URL:-}
      AUDIT_SEALER_ORG_IDS: ${AUDIT_SEALER_ORG_IDS:-}
      AUDIT_SEALER_HEALTH_FILE: /app/health/audit-sealer-health.json
      # KMS: dev provider by default (GOVAI_KMS_PROVIDER=dev + KMS_DEV_SEED); production wires AWS KMS.
      # KMS_DEV_SEED optionalized to `:-` (Fix 3) so `up -d postgres` doesn't require it; when the
      # `sealer` profile runs, loadEnv (under NODE_ENV=development) validates the KMS config at boot.
      GOVAI_KMS_PROVIDER: ${GOVAI_KMS_PROVIDER:-dev}
      KMS_DEV_SEED: ${KMS_DEV_SEED:-}
      # Optional OTLP telemetry — a no-op when unset.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      # Reads the sealer's readiness health-file; healthy iff readiness.ready.
      test: ["CMD", "node", "-e", "const j=JSON.parse(require('fs').readFileSync('/app/health/audit-sealer-health.json','utf8'));process.exit(j.readiness&&j.readiness.ready?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

# The observability stack (otel-collector + Prometheus + Grafana) lives in a SEPARATE
# file — infra/docker-compose.observability.yml — so this file's `up postgres` never
# evaluates the Grafana refuse-if-missing secret. See docs/runbooks/observability-local.md.

volumes:
  govai_pg_data:
