name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions:
  contents: read
  pull-requests: read
jobs:
  # Fast feedback on every push + PR. No GOVAI_INTEGRATION ⇒ vitest excludes tests/integration/**
  # (see vitest.config.ts) ⇒ Docker-free unit-only run.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to compute the diff range against the
          # parent of the PR's base commit; depth=1 makes `<base>^..<head>` fail.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: re2 smoke
        run: pnpm --filter @govai/dlp-br run smoke:re2
      # A2 §9(c)(ii): fail the check if any authorship/tool-attribution string appears in the PR's
      # commit messages or body. base_ref + body are passed via env (never inlined) to avoid script
      # injection from an untrusted PR body. PR-only (base_ref is empty on push).
      - name: A2 forbidden-strings check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin "$BASE_REF" --depth=50 || true
          pattern='co-authored-by|generated with claude|claude code|🤖|generated-with'
          hit=0
          if git log --format='%B' "origin/${BASE_REF}..HEAD" 2>/dev/null | grep -iEq "$pattern"; then
            echo "::error::A2 violation — forbidden authorship/tool string in a commit message"; hit=1
          fi
          if printf '%s' "$PR_BODY" | grep -iEq "$pattern"; then
            echo "::error::A2 violation — forbidden authorship/tool string in the PR body"; hit=1
          fi
          if [ "$hit" -eq 0 ]; then echo "A2 clean (commit messages + PR body)"; else exit 1; fi
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # UI/UX V1 U1: the @govai/ui front end has its own toolchain (jsdom + Testing Library + MSW)
  # and its own build, so it gets its own job rather than being folded into `unit`. Docker-free
  # and fast; it does not touch the API or the database.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @govai/ui typecheck
      - run: pnpm --filter @govai/ui lint
      - run: pnpm --filter @govai/ui test
      - run: pnpm --filter @govai/ui build
      # The bundle is public by construction: every VITE_* value is inlined into it. This step
      # fails the job if anything credential-shaped ever reaches the built assets.
      - name: no secret in the built bundle
        run: |
          set -euo pipefail
          pattern='govai_sk_|sk-ant-|sk-proj-|BEGIN [A-Z ]*PRIVATE KEY|KMS_DEV_SEED|DATABASE_URL|ANTHROPIC_API_KEY|OPENAI_API_KEY'
          if grep -rEIl "$pattern" apps/ui/dist; then
            echo "::error::credential-shaped string found in apps/ui/dist"; exit 1
          fi
          echo "apps/ui/dist clean"

  # The strong gate (branch protection requires this job on main): full suite with testcontainers
  # Postgres. GOVAI_INTEGRATION=1 ⇒ vitest includes tests/integration/** (unit + integration).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - run: pnpm install --frozen-lockfile
      - name: integration suite (testcontainers Postgres)
        run: pnpm test:integration
