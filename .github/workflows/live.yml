name: live-tests
# Issue #20: live provider tests require ANTHROPIC_API_KEY + OPENAI_API_KEY
# GitHub secrets. When secrets are absent, the scheduled cron run was producing
# a daily failure on main, which trains reviewers to ignore CI signals.
#
# GitHub Actions does NOT support `secrets.*` references inside job-level `if:`
# conditions, so we cannot make the schedule self-skip when secrets are missing
# without restructuring the workflow. Until live-test budgets and secrets are
# explicitly configured, live-tests is opt-in via manual `workflow_dispatch:`
# only. Re-enable the cron once secrets + budget guards are in place
# (PR3.x or later).
on:
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - run: pnpm install --frozen-lockfile
      - name: live tests
        env:
          GOVAI_LIVE_TESTS: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm test:live
