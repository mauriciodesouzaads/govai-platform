title = "GovAI gitleaks config"

[[rules]]
id = "kms-dev-seed"
description = "KMS_DEV_SEED with non-empty value"
regex = '''KMS_DEV_SEED=[A-Fa-f0-9]{32,}'''
keywords = ["KMS_DEV_SEED"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9_-]{32,}'''

[allowlist]
paths = [
  '''\.env\.example$''',
  '''docs/.*''',
]
